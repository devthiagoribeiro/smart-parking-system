<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" width="1280" height="1080" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2"/>
      <line x1="-12" y1="10" x2="12" y2="10" stroke="#222" stroke-width="2.5"/>
      <line x1="-8" y1="15" x2="8" y2="15" stroke="#222" stroke-width="2.5"/>
      <line x1="-4" y1="20" x2="4" y2="20" stroke="#222" stroke-width="2.5"/>
    </g>
  </defs>

  <rect width="1280" height="1080" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#111">Smart Parking — Entrada: pinagem da ESP32-CAM</text>
  <text x="40" y="76" font-size="15" fill="#555">ESP32-CAM com a câmera virada para cima. Linhas cheias = montagem final. Linhas tracejadas roxas = só para gravar/monitorar com o Arduino Uno.</text>

  <!-- ===================== ESP32-CAM ===================== -->
  <rect x="600" y="140" width="200" height="590" rx="14" fill="#1f2328"/>
  <text x="700" y="166" text-anchor="middle" fill="#fff" font-weight="bold">ESP32-CAM</text>
  <circle cx="700" cy="235" r="34" fill="#444" stroke="#888" stroke-width="3"/>
  <circle cx="700" cy="235" r="14" fill="#223" stroke="#99a" stroke-width="2"/>
  <text x="700" y="290" text-anchor="middle" fill="#aaa" font-size="12">câmera OV2640</text>
  <rect x="682" y="650" width="36" height="36" rx="4" fill="#fffbe6" stroke="#ccc"/>
  <text x="700" y="704" text-anchor="middle" fill="#aaa" font-size="11">flash (IO4)</text>

  <!-- pinos esquerdos -->
  <g fill="#fff" font-weight="bold" font-size="14">
    <circle cx="614" cy="200" r="6" fill="#d4af37"/><text x="628" y="205">5V</text>
    <circle cx="614" cy="270" r="6" fill="#d4af37"/><text x="628" y="275">GND</text>
    <circle cx="614" cy="340" r="6" fill="#d4af37"/><text x="628" y="345">IO12</text>
    <circle cx="614" cy="410" r="6" fill="#d4af37"/><text x="628" y="415">IO13</text>
    <circle cx="614" cy="480" r="6" fill="#d4af37"/><text x="628" y="485">IO15</text>
    <circle cx="614" cy="550" r="6" fill="#d4af37"/><text x="628" y="555">IO14</text>
    <circle cx="614" cy="620" r="6" fill="#d4af37"/><text x="628" y="625">IO2</text>
    <circle cx="614" cy="690" r="6" fill="#d4af37"/><text x="628" y="695">IO4</text>
  </g>
  <!-- pinos direitos -->
  <g fill="#fff" font-weight="bold" font-size="14" text-anchor="end">
    <circle cx="786" cy="200" r="6" fill="#d4af37"/><text x="772" y="205">3V3</text>
    <circle cx="786" cy="270" r="6" fill="#d4af37"/><text x="772" y="275">IO16</text>
    <circle cx="786" cy="340" r="6" fill="#d4af37"/><text x="772" y="345">IO0</text>
    <circle cx="786" cy="410" r="6" fill="#d4af37"/><text x="772" y="415">GND</text>
    <circle cx="786" cy="480" r="6" fill="#d4af37"/><text x="772" y="485">VCC</text>
    <circle cx="786" cy="550" r="6" fill="#d4af37"/><text x="772" y="555">U0R</text>
    <circle cx="786" cy="620" r="6" fill="#d4af37"/><text x="772" y="625">U0T</text>
    <circle cx="786" cy="690" r="6" fill="#d4af37"/><text x="772" y="695">GND</text>
  </g>

  <!-- ===================== Lado esquerdo ===================== -->

  <!-- 5V -->
  <line x1="530" y1="200" x2="608" y2="200" stroke="#d32f2f" stroke-width="4"/>
  <rect x="440" y="186" width="90" height="28" rx="6" fill="#d32f2f"/>
  <text x="485" y="205" text-anchor="middle" fill="#fff" font-weight="bold">+5V</text>
  <text x="430" y="205" text-anchor="end" fill="#555" font-size="13">fonte 5 V (≥ 1 A)</text>

  <!-- GND -->
  <line x1="530" y1="270" x2="608" y2="270" stroke="#222" stroke-width="4"/>
  <rect x="440" y="256" width="90" height="28" rx="6" fill="#222"/>
  <text x="485" y="275" text-anchor="middle" fill="#fff" font-weight="bold">GND</text>
  <text x="430" y="275" text-anchor="end" fill="#555" font-size="13">GND comum</text>

  <!-- IO12: LED vermelho -->
  <line x1="545" y1="340" x2="608" y2="340" stroke="#d32f2f" stroke-width="3"/>
  <rect x="485" y="331" width="60" height="18" rx="3" fill="#e8d5b5" stroke="#8d6e63"/>
  <text x="515" y="325" text-anchor="middle" font-size="13" fill="#333">220 Ω</text>
  <line x1="440" y1="340" x2="485" y2="340" stroke="#d32f2f" stroke-width="3"/>
  <polygon points="440,326 440,354 412,340" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
  <line x1="410" y1="324" x2="410" y2="356" stroke="#b71c1c" stroke-width="3"/>
  <line x1="410" y1="340" x2="370" y2="340" stroke="#222" stroke-width="3"/>
  <use href="#gnd" x="370" y="340"/>
  <text x="425" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">LED vermelho</text>
  <text x="452" y="372" font-size="11" fill="#666">perna longa (+)</text>
  <text x="300" y="372" font-size="11" fill="#666">perna curta (−)</text>

  <!-- IO13: ECHO com divisor -->
  <line x1="470" y1="410" x2="608" y2="410" stroke="#f9a825" stroke-width="3"/>
  <circle cx="470" cy="410" r="5" fill="#222"/>
  <line x1="440" y1="410" x2="470" y2="410" stroke="#f9a825" stroke-width="3"/>
  <rect x="380" y="401" width="60" height="18" rx="3" fill="#e8d5b5" stroke="#8d6e63"/>
  <text x="410" y="396" text-anchor="middle" font-size="13" fill="#333">1 kΩ</text>
  <line x1="340" y1="410" x2="380" y2="410" stroke="#f9a825" stroke-width="3"/>
  <line x1="470" y1="410" x2="470" y2="418" stroke="#222" stroke-width="2"/>
  <rect x="462" y="418" width="16" height="30" rx="3" fill="#e8d5b5" stroke="#8d6e63"/>
  <text x="484" y="438" font-size="13" fill="#333">2 kΩ</text>
  <use href="#gnd" x="470" y="448"/>
  <text x="540" y="400" text-anchor="middle" font-size="11" fill="#8a6d00">ECHO (≈3,3 V)</text>

  <!-- IO15: TRIG -->
  <line x1="340" y1="480" x2="608" y2="480" stroke="#1976d2" stroke-width="3"/>
  <text x="540" y="472" text-anchor="middle" font-size="11" fill="#0d47a1">TRIG</text>

  <!-- HC-SR04 -->
  <rect x="200" y="385" width="140" height="125" rx="8" fill="#1565c0"/>
  <text x="270" y="404" text-anchor="middle" fill="#fff" font-weight="bold">HC-SR04</text>
  <circle cx="240" cy="452" r="22" fill="#cfd8dc" stroke="#90a4ae" stroke-width="3"/>
  <circle cx="300" cy="452" r="22" fill="#cfd8dc" stroke="#90a4ae" stroke-width="3"/>
  <g fill="#fff" font-size="12" font-weight="bold">
    <text x="334" y="414" text-anchor="end">Echo</text>
    <text x="334" y="484" text-anchor="end">Trig</text>
    <text x="206" y="429">VCC</text>
    <text x="206" y="499">GND</text>
  </g>
  <line x1="180" y1="425" x2="200" y2="425" stroke="#d32f2f" stroke-width="3"/>
  <rect x="110" y="412" width="70" height="26" rx="6" fill="#d32f2f"/>
  <text x="145" y="430" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">+5V</text>
  <line x1="180" y1="495" x2="200" y2="495" stroke="#222" stroke-width="3"/>
  <rect x="110" y="482" width="70" height="26" rx="6" fill="#222"/>
  <text x="145" y="500" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">GND</text>
  <text x="270" y="528" text-anchor="middle" font-size="11" fill="#555">no módulo: VCC · Trig · Echo · GND</text>

  <!-- IO14: Servo -->
  <line x1="340" y1="565" x2="380" y2="565" stroke="#ef6c00" stroke-width="3"/>
  <line x1="380" y1="565" x2="380" y2="550" stroke="#ef6c00" stroke-width="3"/>
  <line x1="380" y1="550" x2="608" y2="550" stroke="#ef6c00" stroke-width="3"/>
  <text x="540" y="542" text-anchor="middle" font-size="11" fill="#bf360c">sinal (laranja)</text>
  <rect x="200" y="545" width="140" height="70" rx="8" fill="#1e88e5"/>
  <text x="270" y="572" text-anchor="middle" fill="#fff" font-weight="bold">Micro servo</text>
  <text x="270" y="590" text-anchor="middle" fill="#e3f2fd" font-size="12">SG90</text>
  <line x1="180" y1="565" x2="200" y2="565" stroke="#d32f2f" stroke-width="3"/>
  <rect x="40" y="552" width="140" height="26" rx="6" fill="#ad1457"/>
  <text x="110" y="570" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">+5V SERVO</text>
  <line x1="180" y1="598" x2="200" y2="598" stroke="#6d4c41" stroke-width="3"/>
  <rect x="110" y="585" width="70" height="26" rx="6" fill="#222"/>
  <text x="145" y="603" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">GND</text>
  <text x="270" y="632" text-anchor="middle" font-size="11" fill="#555">vermelho = + · marrom = GND</text>

  <!-- IO2: LED verde -->
  <line x1="545" y1="620" x2="608" y2="620" stroke="#2e7d32" stroke-width="3"/>
  <rect x="485" y="611" width="60" height="18" rx="3" fill="#e8d5b5" stroke="#8d6e63"/>
  <text x="515" y="605" text-anchor="middle" font-size="13" fill="#333">220 Ω</text>
  <line x1="440" y1="620" x2="485" y2="620" stroke="#2e7d32" stroke-width="3"/>
  <polygon points="440,606 440,634 412,620" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>
  <line x1="410" y1="604" x2="410" y2="636" stroke="#1b5e20" stroke-width="3"/>
  <line x1="410" y1="620" x2="390" y2="620" stroke="#222" stroke-width="3"/>
  <use href="#gnd" x="390" y="620"/>
  <text x="440" y="660" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">LED verde</text>

  <!-- IO4 -->
  <text x="590" y="695" text-anchor="end" font-size="12" fill="#777">IO4 = flash da própria placa (não ligar nada)</text>

  <!-- ===================== Lado direito ===================== -->
  <text x="812" y="205" font-size="12" fill="#777">não usar</text>
  <text x="812" y="275" font-size="12" fill="#777">não usar (PSRAM)</text>
  <text x="812" y="485" font-size="12" font-weight="bold" fill="#c62828">VCC: NÃO LIGAR NADA</text>

  <!-- jumper IO0-GND -->
  <path d="M792,340 H850 V410 H792" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="860" y="368" font-size="12" fill="#7b1fa2" font-weight="bold">jumper IO0 → GND</text>
  <text x="860" y="384" font-size="12" fill="#7b1fa2">só durante a gravação;</text>
  <text x="860" y="400" font-size="12" fill="#7b1fa2">tire e aperte RST para rodar</text>

  <!-- Arduino Uno -->
  <rect x="1030" y="460" width="210" height="310" rx="10" fill="#00838f"/>
  <text x="1135" y="486" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Uno</text>
  <text x="1135" y="504" text-anchor="middle" fill="#e0f7fa" font-size="12">(só ponte USB-serial)</text>
  <g fill="#fff" font-size="13" font-weight="bold">
    <text x="1040" y="555">D0 (RX)</text>
    <text x="1040" y="625">D1 (TX)</text>
    <text x="1040" y="695">GND</text>
    <text x="1040" y="745">5V</text>
  </g>
  <g stroke="#7b1fa2" stroke-width="3" stroke-dasharray="8 5" fill="none">
    <line x1="792" y1="550" x2="1030" y2="550"/>
    <line x1="792" y1="620" x2="1030" y2="620"/>
    <line x1="792" y1="690" x2="1030" y2="690"/>
    <line x1="960" y1="740" x2="1030" y2="740"/>
  </g>
  <rect x="890" y="727" width="70" height="26" rx="6" fill="#d32f2f"/>
  <text x="925" y="745" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">+5V</text>
  <text x="910" y="542" text-anchor="middle" font-size="12" fill="#7b1fa2">U0R ↔ D0 (RX)</text>
  <text x="910" y="612" text-anchor="middle" font-size="12" fill="#7b1fa2">U0T ↔ D1 (TX)</text>
  <!-- RESET-GND do Uno -->
  <text x="1150" y="584" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">RESET ── GND</text>
  <text x="1150" y="600" text-anchor="middle" fill="#e0f7fa" font-size="11">(jumper no Uno)</text>
  <text x="1135" y="790" text-anchor="middle" font-size="12" fill="#00838f" font-weight="bold">TX com TX, RX com RX (não cruza)</text>

  <!-- ===================== Rodapé ===================== -->
  <line x1="40" y1="820" x2="1240" y2="820" stroke="#ddd" stroke-width="2"/>

  <text x="40" y="852" font-size="17" font-weight="bold" fill="#111">Alimentação</text>
  <g font-size="13" fill="#333">
    <rect x="40" y="866" width="14" height="14" fill="#d32f2f"/><text x="62" y="878"><tspan font-weight="bold">+5V</tspan> — fonte 5 V ≥ 1 A: pino 5V da ESP32-CAM e VCC do HC-SR04 (nos testes, o 5V do Uno)</text>
    <rect x="40" y="890" width="14" height="14" fill="#ad1457"/><text x="62" y="902"><tspan font-weight="bold">+5V SERVO</tspan> — fonte 5 V separada: o servo puxa picos que reiniciam a ESP</text>
    <rect x="40" y="914" width="14" height="14" fill="#222"/><text x="62" y="926"><tspan font-weight="bold">GND</tspan> — todos os GND juntos (ESP, HC-SR04, servo, LEDs, fonte do servo)</text>
    <text x="40" y="958" font-weight="bold" fill="#c62828">ECHO do HC-SR04 sai 5 V: sempre passe pelo divisor 1 kΩ / 2 kΩ antes do IO13.</text>
    <text x="40" y="980" fill="#555">Sem 2 kΩ? Use 2 resistores de 1 kΩ em série.</text>
  </g>

  <text x="760" y="852" font-size="17" font-weight="bold" fill="#111">Resumo</text>
  <g font-size="13" fill="#333">
    <text x="760" y="878">IO12 → 220 Ω → LED vermelho → GND</text>
    <text x="760" y="900">IO13 ← divisor ← Echo (HC-SR04)</text>
    <text x="760" y="922">IO15 → Trig (HC-SR04)</text>
    <text x="760" y="944">IO14 → sinal do servo (laranja)</text>
    <text x="760" y="966">IO2  → 220 Ω → LED verde → GND</text>
    <text x="760" y="988">5V / GND → fonte · U0R/U0T/IO0 → só gravação</text>
  </g>

  <text x="40" y="1050" font-size="12" fill="#888">Pinos definidos em main/app_config.h · LEDs: os dois acesos = processando · verde = liberado · vermelho piscando = negado · os dois piscando = sem Wi-Fi</text>
</svg>
