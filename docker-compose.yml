services:
  postgres:
    image: postgres:16
    container_name: smart-parking-postgres
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - smart_parking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_parking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_parking_postgres_data:
